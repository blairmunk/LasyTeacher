<section class="document-section document-section-{{ section.section_type }} remedial-answers">
    <h2>{{ section.title|default:"Ответы к тренировочным заданиям" }}</h2>
    <ol>
        {% for task in payload.tasks %}
            <li>{{ task.answer|linebreaksbr }}</li>
        {% endfor %}
    </ol>
</section>
