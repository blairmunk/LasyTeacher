<section class="document-section document-section-{{ section.section_type }} document-full-solutions">
    <h2>{{ section.title|default:"Полные решения" }}</h2>
    {% for variant in payload.variants %}
        <article class="document-variant-full-solutions">
            <h3>{{ variant.title }}</h3>
            <ol>
                {% for task in variant.tasks %}
                    <li>{{ task.full_solution|linebreaksbr }}</li>
                {% endfor %}
            </ol>
        </article>
    {% endfor %}
</section>
