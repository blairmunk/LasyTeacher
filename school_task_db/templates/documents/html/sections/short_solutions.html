<section class="document-section document-section-{{ section.section_type }} document-short-solutions">
    <h2>{{ section.title|default:"Краткие решения" }}</h2>
    {% for variant in payload.variants %}
        <article class="document-variant-short-solutions">
            <h3>{{ variant.title }}</h3>
            <ol>
                {% for task in variant.tasks %}
                    <li>{{ task.short_solution|linebreaksbr }}</li>
                {% endfor %}
            </ol>
        </article>
    {% endfor %}
</section>
